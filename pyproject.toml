[project]
name = "contact-sales-core"
version = "0.1.0"
description = "Phase 1 deterministic core for the Repeatable Contact Form Sales System"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "sqlalchemy==2.0.43",
  "psycopg[binary]==3.2.10",
  "redis==6.4.0",
  "pydantic-settings==2.10.1",
  "requests==2.32.5",
  "beautifulsoup4==4.13.5",
  "playwright==1.54.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
